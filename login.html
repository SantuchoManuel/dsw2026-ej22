<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>
<body>
  <div class="login-container">
    <img src="https://cdn.iconscout.com/icon/premium/png-512-thumb/signo-de-hospital-icon-svg-download-png-5859792.png?f=webp&w=256" alt="logo">
    <h3>MedPortal</h3>
    <form>
      <h5>Bienvenido de nuevo</h5>
      <a>Por favor, autentifiquese para acceder al portal de proveedores.</a>
      <label for="username">Nombre de Usuario:</label>
      <input type="text" id="username" name="username" required placeholder="Ingrese ID de admin">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required placeholder="&#9679&#9679&#9679&#9679&#9679&#9679">
      <button type="submit">Iniciar Sesión</button>
    </form>
    <footer><h4>Solo Acceso Seguro: Este sistema es para personal médico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.</h4></footer>
  </div>
</body>
</html>
